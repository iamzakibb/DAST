stages:
  - reachability
  - authn
  - session
  - verify

variables:
  OKTA_DOMAIN: "replace-with-okta-domain"     # required: e.g. dev-123456.okta.com
  OKTA_USERNAME: ""
  OKTA_PASSWORD: ""
  TARGET_URL: "https://protected-app.example.com/"

  LOG_DIR: "okta_logs"
  ARTIFACT_DIR: "okta_artifacts"

# ---- quick helper template for artifacts and dirs ----
.default_artifacts: &default_artifacts
  artifacts:
    when: always
    expire_in: 3 days
    paths:
      - ${LOG_DIR}/
      - ${ARTIFACT_DIR}/

# 1) reachability
okta_reachability:
  stage: reachability
  <<: *default_artifacts
  script: |-
    #!/usr/bin/env bash
    set -euo pipefail

    : "${OKTA_DOMAIN:?OKTA_DOMAIN must be set}"
    mkdir -p "${LOG_DIR}" "${ARTIFACT_DIR}"
    echo "[reachability] checking https://${OKTA_DOMAIN}" > "${LOG_DIR}/run.log"
    # record headers and small body
    curl -sS -I --max-time 10 "https://${OKTA_DOMAIN}" -D "${LOG_DIR}/reach_headers.txt" -o "${LOG_DIR}/reach_body.txt" || echo "[reachability] curl returned non-zero"
    echo "[reachability] headers:" >> "${LOG_DIR}/run.log"
    sed -n '1,60p' "${LOG_DIR}/reach_headers.txt" >> "${LOG_DIR}/run.log" || true
    cp -v "${LOG_DIR}/reach_headers.txt" "${ARTIFACT_DIR}/" || true
    cp -v "${LOG_DIR}/reach_body.txt" "${ARTIFACT_DIR}/" || true
    echo "[reachability] done" >> "${LOG_DIR}/run.log"

# 2) authn (username/password)
okta_authn:
  stage: authn
  allow_failure: true     # keep pipeline flexible while testing
  <<: *default_artifacts
  script: |-
    #!/usr/bin/env bash
    set -euo pipefail

    : "${OKTA_DOMAIN:?OKTA_DOMAIN must be set}"
    : "${OKTA_USERNAME:?OKTA_USERNAME must be set}"
    : "${OKTA_PASSWORD:?OKTA_PASSWORD must be set}"

    mkdir -p "${LOG_DIR}" "${ARTIFACT_DIR}"
    AUTHN_BODY="${LOG_DIR}/authn_body.txt"
    AUTHN_HDRS="${LOG_DIR}/authn_headers.txt"
    RUNLOG="${LOG_DIR}/run.log"

    echo "[authn] POST /api/v1/authn -> https://${OKTA_DOMAIN}" | tee -a "${RUNLOG}"

    # create temporary payload file (safer than embedding in shell)
    payload="$(mktemp)"
    printf '{"username":"%s","password":"%s"}\n' "${OKTA_USERNAME}" "${OKTA_PASSWORD}" > "${payload}"

    set +e
    curl -i -sS -X POST "https://${OKTA_DOMAIN}/api/v1/authn" \
      -H "Accept: application/json" -H "Content-Type: application/json" \
      --data @"${payload}" -D "${AUTHN_HDRS}" -o "${AUTHN_BODY}"
    rc=$?
    set -e
    rm -f "${payload}"

    echo "=== authn headers (top) ===" | tee -a "${RUNLOG}"
    sed -n '1,80p' "${AUTHN_HDRS}" | tee -a "${RUNLOG}" || true
    echo "=== authn body (top) ===" | tee -a "${RUNLOG}"
    sed -n '1,200p' "${AUTHN_BODY}" | tee -a "${RUNLOG}" || true

    # parse sessionToken: try python3 if available, else use sed fallback
    sessionToken=""
    if command -v python3 >/dev/null 2>&1; then
      sessionToken=$(python3 -c 'import json,sys; p=sys.argv[1]; print((lambda: (json.load(open(p)).get("sessionToken", "") or ""))() if True else "")' "${AUTHN_BODY}" 2>/dev/null || true)
    else
      # sed: look for "sessionToken" : "VAL"
      sessionToken=$(sed -n 's/.*"sessionToken"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p' "${AUTHN_BODY}" || true)
    fi

    if [ -n "${sessionToken}" ]; then
      echo "[authn] sessionToken parsed (len=${#sessionToken})" | tee -a "${RUNLOG}"
      printf "%s" "${sessionToken}" > "${LOG_DIR}/sessionToken.txt"
      cp -v "${LOG_DIR}/sessionToken.txt" "${ARTIFACT_DIR}/" || true
    else
      echo "[authn] NO sessionToken parsed. The response may be HTML, a redirect, or require MFA/federation." | tee -a "${RUNLOG}"
      # save body to artifacts already by artifacts config
    fi

    # exit with the curl rc so job result reflects the HTTP curl result
    exit ${rc}

# 3) session creation (cookie jar)
okta_session:
  stage: session
  allow_failure: true
  <<: *default_artifacts
  script: |-
    #!/usr/bin/env bash
    set -euo pipefail

    mkdir -p "${LOG_DIR}" "${ARTIFACT_DIR}"
    RUNLOG="${LOG_DIR}/run.log"
    COOKIE_JAR="${LOG_DIR}/okta_cookies.txt"
    SESS_HDRS="${LOG_DIR}/sess_headers.txt"
    SESS_BODY="${LOG_DIR}/sess_body.txt"

    echo "[session] attempt session creation (POST /api/v1/sessions) if sessionToken present" | tee -a "${RUNLOG}"

    if [ -f "${LOG_DIR}/sessionToken.txt" ] && [ -s "${LOG_DIR}/sessionToken.txt" ]; then
      sessionToken="$(cat "${LOG_DIR}/sessionToken.txt")"
      printf '{"sessionToken":"%s"}\n' "${sessionToken}" > "${LOG_DIR}/sess_payload.json"

      set +e
      curl -i -sS -X POST "https://${OKTA_DOMAIN}/api/v1/sessions" \
        -H "Accept: application/json" -H "Content-Type: application/json" \
        --data @"${LOG_DIR}/sess_payload.json" -c "${COOKIE_JAR}" -D "${SESS_HDRS}" -o "${SESS_BODY}"
      rc=$?
      set -e

      echo "=== sessions headers (top) ==="
      sed -n '1,80p' "${SESS_HDRS}" || true
      echo "=== sessions body (top) ==="
      sed -n '1,200p' "${SESS_BODY}" || true
      echo "=== cookie jar (first 200 lines) ==="
      sed -n '1,200p' "${COOKIE_JAR}" || true

      # if cookie jar doesn't contain obvious Okta cookie names, try redirect fallback
      cookie_ok=false
      if [ -f "${COOKIE_JAR}" ] && [ -s "${COOKIE_JAR}" ]; then
        if grep -qi 'sid' "${COOKIE_JAR}" 2>/dev/null || grep -qi 'okta' "${COOKIE_JAR}" 2>/dev/null || grep -qi 'JSESSIONID' "${COOKIE_JAR}" 2>/dev/null; then
          cookie_ok=true
        fi
      fi

      if [ "${cookie_ok}" = false ]; then
        echo "[session] sessions API did not produce cookie or cookie not recognized. Trying sessionCookieRedirect fallback..." | tee -a "${RUNLOG}"
        set +e
        # best-effort redirect to Okta app home to seed cookies
        curl -sS -i -L -c "${COOKIE_JAR}" "https://${OKTA_DOMAIN}/login/sessionCookieRedirect?token=${sessionToken}&redirectUrl=https://${OKTA_DOMAIN}/app/UserHome" -o "${LOG_DIR}/redirect_out.txt"
        rc_redirect=$?
        set -e
        echo "[session] redirect curl rc=${rc_redirect}" | tee -a "${RUNLOG}"
        sed -n '1,40p' "${LOG_DIR}/redirect_out.txt" || true
        echo "=== cookie jar after redirect (top) ==="
        sed -n '1,200p' "${COOKIE_JAR}" || true
      fi

      # copy cookie jar to artifacts
      cp -v "${COOKIE_JAR}" "${ARTIFACT_DIR}/" || true
      exit ${rc}
    else
      echo "[session] No sessionToken file found -> cannot create session. Inspect authn job artifacts." | tee -a "${RUNLOG}"
      exit 0
    fi

# 4) verify protected target using cookie jar (or HEAD if no cookie)
verify_target:
  stage: verify
  allow_failure: true
  <<: *default_artifacts
  script: |-
    #!/usr/bin/env bash
    set -euo pipefail

    mkdir -p "${LOG_DIR}" "${ARTIFACT_DIR}"
    RUNLOG="${LOG_DIR}/run.log"
    COOKIE_JAR="${LOG_DIR}/okta_cookies.txt"
    TARGET_HDRS="${LOG_DIR}/target_headers.txt"
    TARGET_BODY="${LOG_DIR}/target_body.txt"

    echo "[verify] trying to access TARGET_URL: ${TARGET_URL}" | tee -a "${RUNLOG}"

    if [ -f "${COOKIE_JAR}" ] && [ -s "${COOKIE_JAR}" ]; then
      echo "[verify] using cookie jar to request protected URL" | tee -a "${RUNLOG}"
      curl -sS -w "%{http_code}" -b "${COOKIE_JAR}" -D "${TARGET_HDRS}" -o "${TARGET_BODY}" --max-time 30 "${TARGET_URL}" > "${LOG_DIR}/http_code.txt" || echo "[verify] curl returned non-zero"
      cat "${LOG_DIR}/http_code.txt" | tee -a "${RUNLOG}" || true
    else
      echo "[verify] no cookie jar available; performing HEAD request" | tee -a "${RUNLOG}"
      curl -I -sS --max-time 15 "${TARGET_URL}" -D "${TARGET_HDRS}" -o "${TARGET_BODY}" || echo "[verify] HEAD failed"
    fi

    echo "=== target headers (top) ==="
    sed -n '1,80p' "${TARGET_HDRS}" || true
    echo "=== target body (first 200 chars) ==="
    sed -n '1,50p' "${TARGET_BODY}" || true

    cp -v "${TARGET_HDRS}" "${ARTIFACT_DIR}/" || true
    cp -v "${TARGET_BODY}" "${ARTIFACT_DIR}/" || true

    echo "[verify] done" | tee -a "${RUNLOG}"
