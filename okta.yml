stages:
  - prepare
  - dast

okta_get_session:
  stage: prepare
  variables:
    OKTA_BASE_URL: "https://your-okta-domain.okta.com"
    APP_URL: "https://your-app.example.com"
  script:
    - |
      set -eo pipefail

      # --------------------------------------------------
      # HARD-CODED OKTA CREDENTIALS (PoC ONLY)
      # --------------------------------------------------
      OKTA_TEST_USER="poc-dast-user@company.com"
      OKTA_TEST_PASS="PocPassword123!"
      echo "# default empty dotenv" > dast_env_vars.env
      echo "Detecting available JSON parsers..."
      if command -v jq >/dev/null 2>&1; then
        PARSER="jq"
      elif command -v python3 >/dev/null 2>&1; then
        PARSER="python3"
      else
        PARSER="sed"
      fi
      echo "Using parser: $PARSER"

      echo "Calling Okta primary auth..."
      resp="$(curl -sS -X POST "$OKTA_BASE_URL/api/v1/authn" \
        -H 'Accept: application/json' \
        -H 'Content-Type: application/json' \
        -d "{\"username\":\"$OKTA_TEST_USER\",\"password\":\"$OKTA_TEST_PASS\"}" )" || {
        echo "# okta curl failed" > dast_env_vars.env
        exit 0
      }

      if [ "$PARSER" = "jq" ]; then
        sessionToken="$(printf "%s" "$resp" | jq -r '.sessionToken // empty')"
      elif [ "$PARSER" = "python3" ]; then
        sessionToken="$(printf "%s" "$resp" | python3 -c 'import sys,json; j=json.load(sys.stdin); print(j.get("sessionToken",""))')"
      else
        sessionToken="$(printf "%s" "$resp" | sed -n 's/.*"sessionToken"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p' | head -n1 || true)"
      fi

      if [ -z "$sessionToken" ]; then
        echo "# no session token" > dast_env_vars.env
        exit 0
      fi

      echo "Creating Okta session cookie..."
      cookiejar="$(mktemp)"
      curl -sS -L -c "$cookiejar" \
        "$OKTA_BASE_URL/login/sessionCookieRedirect?token=${sessionToken}&redirectUrl=${APP_URL}" \
        >/dev/null 2>&1 || {
          echo "# cookie redirect failed" > dast_env_vars.env
          exit 0
        }

      cookie_value="$(awk 'NF && $7 !~ /^#/ {print $6 \"=\" $7; exit}' "$cookiejar" | tr -d '\r\n' || true)"

      if [ -z "$cookie_value" ]; then
        echo "# cookie extract failed" > dast_env_vars.env
        exit 0
      fi

      echo "DAST_REQUEST_COOKIES=${cookie_value}" > dast_env_vars.env
      echo "Okta cookie prepared for DAST"

  artifacts:
    reports:
      dotenv: dast_env_vars.env
    expire_in: 1 hour
  rules:
    - when: always
