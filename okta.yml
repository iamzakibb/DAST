stages:
  - prepare
  - dast

# --------------------------------------------------
# Stage 1: Obtain Okta session cookie (PoC only)
# --------------------------------------------------
okta_get_session:
  stage: prepare
  variables:
    OKTA_BASE_URL: "https://your-okta-domain.okta.com"
    APP_URL: "https://your-app.example.com"
  script:
    - |
      #!/usr/bin/env bash
      set -o pipefail

      # Always create dotenv so artifacts never fail
      echo "# default empty dotenv" > dast_env_vars.env
      OKTA_TEST_USER="poc-dast-user@company.com"
      OKTA_TEST_PASS="PocPassword123!"

      echo "Detecting JSON parser..."
      if command -v jq >/dev/null 2>&1; then
        PARSER="jq"
      elif command -v python3 >/dev/null 2>&1; then
        PARSER="python3"
      else
        PARSER="sed"
      fi
      echo "Using parser: $PARSER"

      echo "Calling Okta primary authentication API..."
      resp="$(curl -sS -X POST "$OKTA_BASE_URL/api/v1/authn" \
        -H 'Accept: application/json' \
        -H 'Content-Type: application/json' \
        -d "{\"username\":\"$OKTA_TEST_USER\",\"password\":\"$OKTA_TEST_PASS\"}" )" || exit 0

      # Extract sessionToken
      if [ "$PARSER" = "jq" ]; then
        sessionToken="$(printf "%s" "$resp" | jq -r '.sessionToken // empty')"
      elif [ "$PARSER" = "python3" ]; then
        sessionToken="$(printf "%s" "$resp" | python3 -c 'import sys,json; j=json.load(sys.stdin); print(j.get("sessionToken",""))')"
      else
        sessionToken="$(printf "%s" "$resp" | sed -n 's/.*"sessionToken"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p' | head -n1)"
      fi

      [ -z "$sessionToken" ] && exit 0

      echo "Creating Okta session cookie..."
      cookiejar="$(mktemp)"

      curl -sS -L -c "$cookiejar" \
        "$OKTA_BASE_URL/login/sessionCookieRedirect?token=${sessionToken}&redirectUrl=${APP_URL}" \
        >/dev/null 2>&1 || exit 0

      cookie_value="$(awk 'NF && $7 !~ /^#/ {print $6 \"=\" $7; exit}' "$cookiejar")"
      [ -z "$cookie_value" ] && exit 0

      echo "DAST_REQUEST_COOKIES=${cookie_value}" > dast_env_vars.env
      echo "Okta cookie ready for DAST"

  artifacts:
    reports:
      dotenv: dast_env_vars.env
    expire_in: 1 hour
  rules:
    - when: always


dast:
  stage: dast
  needs:
    - job: okta_get_session
      artifacts: true

  variables:
    DAST_TARGET_URL: "https://your-app.example.com"

  script:
    - |
      #!/usr/bin/env bash
      set -o pipefail

      # Load Okta cookie if present
      if [ -f dast_env_vars.env ]; then
        set +e
        . ./dast_env_vars.env 2>/dev/null || true
        set -e
      fi

      TARGET="${DAST_TARGET_URL}"
      echo "Running DAST PoC against: ${TARGET}"

      REPORT="gl-dast-report.json"
      SUMMARY="dast_probe_summary.txt"
      PAGE="page_snippet.html"

      # --------------------------------------------------
      # Try local OWASP ZAP if preinstalled
      # --------------------------------------------------
      if [ -x "/opt/zap/zap-baseline.py" ]; then
        echo "Local ZAP found — running baseline scan"
        export DAST_REQUEST_COOKIES="${DAST_REQUEST_COOKIES:-}"
        /opt/zap/zap-baseline.py -t "$TARGET" -r zap_report.html || true
        echo '{}' > "$REPORT"
        exit 0
      fi

      # --------------------------------------------------
      # Fallback: safe probe (no downloads)
      # --------------------------------------------------
      echo "No scanner available — running safe connectivity probe"
      echo "Target: $TARGET" > "$SUMMARY"

      CURL_COOKIE=""
      [ -n "${DAST_REQUEST_COOKIES:-}" ] && CURL_COOKIE="-b ${DAST_REQUEST_COOKIES}"

      curl -sI --max-time 20 $CURL_COOKIE "$TARGET" >> "$SUMMARY" || true
      curl -s --max-time 20 $CURL_COOKIE "$TARGET" | head -c 20000 > "$PAGE" || true

      printf '{ "scan":"poc","target":"%s","vulnerabilities":[] }\n' "$TARGET" > "$REPORT"

  artifacts:
    paths:
      - gl-dast-report.json
      - dast_probe_summary.txt
      - page_snippet.html
    expire_in: 1 day

  allow_failure: true
  rules:
    - when: manual
